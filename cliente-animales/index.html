<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de animales</title>

    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <!-- ENCABEZADO -->
    <header class="encabezado">
      <img src="img/huella.png" class="logo" />
      <div class="texto-encabezado">
        <h1>Catálogo de animales</h1>
        <p>Consulta y administra información de animales</p>
      </div>
    </header>

    <!-- CUERPO -->
    <main class="container py-4">
      <div class="row g-4">
        <!-- FORMULARIO -->
        <section class="col-12 col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 id="tituloFormulario" class="h4 mb-3">Registrar animal</h2>

              <form id="formularioAnimal">
                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre común</label>
                  <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    required
                    maxlength="100"
                  />
                </div>

                <div class="mb-3">
                  <label for="nombreCientifico" class="form-label"
                    >Nombre científico</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="nombreCientifico"
                    required
                    maxlength="100"
                  />
                </div>

                <div class="mb-3">
                  <label for="region" class="form-label">Región</label>
                  <input
                    type="text"
                    class="form-control"
                    id="region"
                    required
                    maxlength="100"
                  />
                </div>

                <div class="mb-3">
                  <label for="tipo" class="form-label">Tipo de animal</label>
                  <select class="form-select" id="tipo" required>
                    <option value="">Selecciona una opción</option>
                    <option value="Mamífero">Mamífero</option>
                    <option value="Ave">Ave</option>
                    <option value="Reptil">Reptil</option>
                    <option value="Anfibio">Anfibio</option>
                    <option value="Pez">Pez</option>
                    <option value="Invertebrado">Invertebrado</option>
                    <option value="Otro">Otro</option>
                  </select>
                </div>

                <div class="d-grid gap-2">
                  <button
                    type="submit"
                    id="botonGuardar"
                    class="btn btn-primary"
                  >
                    Guardar
                  </button>

                  <button
                    type="button"
                    id="botonCancelar"
                    class="btn btn-outline-secondary d-none"
                  >
                    Cancelar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <!-- TABLA DE REGISTROS -->
        <section class="col-12 col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body">
              <div
                class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"
              >
                <h2>Animales registrados</h2>

                <button
                  id="botonActualizar"
                  class="btn btn-outline-primary"
                  type="button"
                >
                  Actualizar registros
                </button>
              </div>

              <div class="table-responsive">
                <table
                  class="table table-striped table-hover align-middle text-center"
                >
                  <thead class="table-dark">
                    <tr>
                      <th>ID</th>
                      <th>Nombre</th>
                      <th>Nombre Científico</th>
                      <th>Región</th>
                      <th>Tipo</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>

                  <tbody id="tablaAnimales">
                    <tr>
                      <td colspan="6" class="text-center">
                        Cargando registros...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <p id="totalAnimales" class="text-secondary mb-0">
                Total de animales: 0
              </p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Lógica de la aplicación -->
    <script src="app.js"></script>
  </body>
</html>
